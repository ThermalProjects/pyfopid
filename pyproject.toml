[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfopid"
dynamic = ["version"]
description = "Fractional-order modelling and control in Python: Grünwald-Letnikov operators, Oustaloup approximations and FOPID controllers."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Miguel F. Ferrer Pareja" }]
keywords = [
    "fractional calculus",
    "fractional-order control",
    "FOPID",
    "Grünwald-Letnikov",
    "Oustaloup",
    "control systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "control>=0.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/ThermalProjects/pyfopid"
Issues = "https://github.com/ThermalProjects/pyfopid/issues"

[tool.hatch.version]
path = "src/pyfopid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfopid"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/pyfopid"]
addopts = "--doctest-modules -q"
